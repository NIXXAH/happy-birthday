<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Gallery ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0d0b10;color:#f8f3f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{width:min(1100px,92%);margin:auto}.hero{text-align:center;padding:70px 0 35px}.eyebrow{color:#e7a9c8;letter-spacing:.16em;text-transform:uppercase;font-size:.75rem}.hero h1{font-size:clamp(2.3rem,7vw,5rem);margin:12px 0 8px;line-height:1}.hero p{color:#aaa1aa;margin:0 auto;max-width:560px;line-height:1.6}.toolbar{display:flex;justify-content:center;margin:24px 0 45px}.primary{border:0;border-radius:999px;padding:14px 22px;background:#f1b4d2;color:#21151d;font-weight:800;cursor:pointer;box-shadow:0 8px 30px #0005}.primary:hover{transform:translateY(-1px)}.status{text-align:center;color:#aaa1aa;min-height:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:80px}.card{overflow:hidden;border:1px solid #ffffff12;background:#151219;border-radius:22px;box-shadow:0 12px 35px #0005}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}.meta{padding:12px 14px 15px;display:flex;justify-content:space-between;gap:12px}.who{font-weight:750}.date{font-size:.78rem;color:#8f8790}.empty{text-align:center;color:#8f8790;padding:55px 20px;border:1px dashed #ffffff1c;border-radius:22px;grid-column:1/-1}.modal{position:fixed;inset:0;background:#050407d9;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.panel{width:min(500px,100%);background:#17131a;border:1px solid #ffffff16;border-radius:26px;padding:24px;box-shadow:0 25px 80px #0008}.panel h2{margin:0 0 6px}.muted{color:#968e97;font-size:.9rem;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choice{border:1px solid #ffffff18;background:#211b24;color:#eee;border-radius:16px;padding:14px;cursor:pointer}.choice.selected{border-color:#e7a9c8;background:#392432}.drop{border:1px dashed #ffffff28;border-radius:18px;padding:25px;text-align:center;margin:12px 0;cursor:pointer}.drop input{display:none}.preview{width:100%;max-height:360px;object-fit:contain;border-radius:16px;margin-top:14px;background:#0b090c;display:none}.actions{display:flex;gap:10px;margin-top:18px}.secondary,.upload{flex:1;border:0;border-radius:14px;padding:13px;cursor:pointer;font-weight:750}.secondary{background:#29232b;color:#eee}.upload{background:#f1b4d2;color:#21151d}.upload:disabled{opacity:.45;cursor:not-allowed}.lightbox img{max-width:min(1000px,95vw);max-height:85vh;border-radius:18px}.close{position:fixed;top:20px;right:22px;background:#ffffff18;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}.note{font-size:.75rem;color:#756e77;text-align:center;padding:0 0 35px}.error{color:#ff9eae}.success{color:#9fe2b7}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{padding-top:48px}.meta{display:block}.date{margin-top:4px}}@media(max-width:470px){.grid{grid-template-columns:1fr 1fr}.photo{aspect-ratio:1/1}.card{border-radius:17px}.panel{padding:19px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="eyebrow">a little place for us</div>
<h1>Our Gallery ♡</h1>
<p>Pictures, little moments, random selfies and memories we can keep adding to.</p>
</section>
<div class="toolbar"><button class="primary" id="addBtn">＋ Add a memory</button></div>
<div class="status" id="status">Loading our memories…</div>
<section class="grid" id="gallery"></section>
<p class="note">Only upload photos you both want to keep here. ♡</p>
</main>

<div class="modal" id="modal">
<div class="panel">
<h2>Add a memory ♡</h2>
<p class="muted">Choose who this photo is from, then pick a picture.</p>
<div class="choices">
<button class="choice" data-who="Fiq">♡ Fiq</button>
<button class="choice" data-who="Niña">♡ Niña</button>
</div>
<label class="drop" id="drop">Tap here to choose a photo
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment">
<div class="muted" style="margin-top:8px">JPG, PNG or WebP · max 6 MB</div>
<img class="preview" id="preview" alt="Selected photo preview">
</label>
<div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="upload" id="upload" disabled>Add to gallery</button></div>
<div class="status" id="uploadStatus" style="margin:14px 0 0"></div>
</div>
</div>

<div class="modal lightbox" id="lightbox"><button class="close" id="lightClose">×</button><img id="lightImg" alt="Gallery photo"></div>

<script>
// ============================================================
// 1. PUT YOUR SUPABASE DETAILS HERE
// ============================================================
const SUPABASE_URL = "https://lhcbytddvbkpeixrclzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_8tLhbZBnory-M8495pwKkQ_5wHdXNH1";

const BUCKET = "our-gallery";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const gallery = document.getElementById("gallery");
const status = document.getElementById("status");
const modal = document.getElementById("modal");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const uploadBtn = document.getElementById("upload");
const uploadStatus = document.getElementById("uploadStatus");
let selectedWho = null;
let selectedFile = null;

function setStatus(text, type="") { status.textContent=text; status.className="status "+type; }

async function ensureAnonymousSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session) return true;
  const { error } = await supabase.auth.signInAnonymously();
  if(error){
    console.error(error);
    setStatus("Supabase anonymous sign-in is not enabled yet.", "error");
    return false;
  }
  return true;
}

async function loadGallery(){
  const { data, error } = await supabase.from("gallery_photos").select("id,image_url,uploaded_by,uploaded_at").order("uploaded_at", {ascending:false});
  if(error){
    console.error(error);
    setStatus("Couldn't load the gallery. Check the Supabase setup.", "error");
    return;
  }
  gallery.innerHTML="";
  if(!data.length){
    gallery.innerHTML='<div class="empty">No memories yet.<br>Be the first one to add a photo. ♡</div>';
  } else {
    for(const item of data){
      const card=document.createElement("article");
      card.className="card";
      const img=document.createElement("img");
      img.className="photo"; img.src=item.image_url; img.alt="Memory added by "+item.uploaded_by; img.loading="lazy";
      img.addEventListener("click",()=>openLightbox(item.image_url));
      const meta=document.createElement("div"); meta.className="meta";
      const who=document.createElement("div"); who.className="who"; who.textContent="♡ "+item.uploaded_by;
      const date=document.createElement("div"); date.className="date"; date.textContent=new Date(item.uploaded_at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
      meta.append(who,date); card.append(img,meta); gallery.append(card);
    }
  }
  setStatus(data.length ? `${data.length} ${data.length===1?'memory':'memories'} together ♡` : "Your gallery is empty — add the first one ♡", "success");
}

function resetModal(){
  selectedWho=null; selectedFile=null; fileInput.value=""; preview.style.display="none"; preview.removeAttribute("src"); uploadBtn.disabled=true; uploadStatus.textContent=""; uploadStatus.className="status";
  document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
}

document.getElementById("addBtn").onclick = () => {
    modal.classList.add("show");
};
  
document.getElementById("cancel").onclick=()=>{modal.classList.remove("show");resetModal()};
document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{selectedWho=btn.dataset.who;document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");uploadBtn.disabled=!(selectedWho&&selectedFile)});
document.getElementById("drop").onclick=e=>{if(e.target!==fileInput)fileInput.click()};
fileInput.onchange=()=>{
  const file=fileInput.files[0];
  if(!file)return;
  if(file.size>6*1024*1024){uploadStatus.textContent="That photo is over 6 MB. Pick a smaller one.";uploadStatus.className="status error";fileInput.value="";return;}
  if(!file.type.startsWith("image/")){uploadStatus.textContent="Please choose an image.";uploadStatus.className="status error";return;}
  selectedFile=file; preview.src=URL.createObjectURL(file); preview.style.display="block"; uploadBtn.disabled=!selectedWho;
};

uploadBtn.onclick=async()=>{
  if(!selectedWho||!selectedFile)return;
  uploadBtn.disabled=true; uploadStatus.textContent="Uploading…"; uploadStatus.className="status";
  const sessionOk=await ensureAnonymousSession(); if(!sessionOk){uploadBtn.disabled=false;return;}
  const ext=(selectedFile.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const filePath=`${crypto.randomUUID()}.${ext}`;
  const { error: uploadError }=await supabase.storage.from(BUCKET).upload(filePath,selectedFile,{contentType:selectedFile.type,cacheControl:"31536000",upsert:false});
  if(uploadError){console.error(uploadError);uploadStatus.textContent="Upload failed: "+uploadError.message;uploadStatus.className="status error";uploadBtn.disabled=false;return;}
  const { data: publicData }=supabase.storage.from(BUCKET).getPublicUrl(filePath);
  const { error: dbError }=await supabase.from("gallery_photos").insert({image_url:publicData.publicUrl,uploaded_by:selectedWho});
  if(dbError){console.error(dbError);uploadStatus.textContent="Photo uploaded, but its gallery entry failed. Check the database policy.";uploadStatus.className="status error";uploadBtn.disabled=false;return;}
  uploadStatus.textContent="Added! ♡"; uploadStatus.className="status success";
  await loadGallery();
  setTimeout(()=>{modal.classList.remove("show");resetModal()},500);
};

function openLightbox(url){document.getElementById("lightImg").src=url;document.getElementById("lightbox").classList.add("show")}
document.getElementById("lightClose").onclick=()=>document.getElementById("lightbox").classList.remove("show");
document.getElementById("lightbox").onclick=e=>{if(e.target.id==="lightbox")e.currentTarget.classList.remove("show")};

(async()=>{
  const ok=await ensureAnonymousSession();
  if(ok) await loadGallery();
})();
</script>
</body>
</html>
